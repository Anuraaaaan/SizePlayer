version: 1

#message in the console
console-message: "&4This command can only be entered by the player."

#message if permission is not granted
no-permissions: "&4You don't have enough rights"

#message when rebooting config
config-reloaded: "&aConfig rebooted"

#message when resizing.
size-set: "&aYour size is set to %.1f"

#message when value is incorrect
invalid-range: "&4The size value is outside the range from 0.4 to 10.0"
