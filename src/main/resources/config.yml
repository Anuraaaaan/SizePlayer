version: 2

values:

  # Language file used by the plugin.
  # For example: ru, en.
  lang: ru
  # Minimum possible player size. In vanilla, the minimum value is 0.0625
  min_value: 0.4
  # Maximum possible player size. In vanilla, the maximum value is 16
  max_value: 10

  # ==================== HEALTH FORMULAS ====================
  # Variable:
  #   x — player size (e.g., 0.4, 1, 2, 10, etc.)
  #
  # The formula must return a number — the amount of health.
  #
  # Example: 20 * x
  #   At x = 1 → 20 hearts
  #   At x = 0.5 → 10 hearts
  # ---------------------------------------------------------
  # SUPPORTED OPERATIONS:
  #   +   addition
  #   -   subtraction
  #   *   multiplication
  #   /   division
  #   ^   exponentiation
  # ---------------------------------------------------------
  # SUPPORTED FUNCTIONS (exp4j):
  # Roots:
  #   sqrt(x)   — square root
  #   cbrt(x)   — cube root
  # Trigonometry:
  #   sin(x)
  #   cos(x)
  #   tan(x)
  #   asin(x)
  #   acos(x)
  #   atan(x)
  # Logarithms:
  #   log(x)    — natural logarithm
  #   log10(x)  — base-10 logarithm
  # Rounding:
  #   floor(x)  — round down
  #   ceil(x)   — round up
  #   round(x)  — round to nearest
  # Absolute and misc:
  #   abs(x)    — absolute value
  #   min(a,b)  — minimum of two numbers
  #   max(a,b)  — maximum of two numbers
  # ---------------------------------------------------------
  # CONSTANTS:
  #   pi — Pi (3.1415926...)
  #   e  — Euler's number (2.71828...)
  # ---------------------------------------------------------
  # LOGIC:
  #
  # The size range is split into 2 zones:
  #
  #   1) x < 1      → uses min_formula
  #   2) x > 1      → uses max_formula
  #
  # This allows separate tuning for small and large players.
  # ---------------------------------------------------------

  # Formula for sizes LESS than 1
  # Example: 20 * x → at x=0.4 health = 8 hearts
  min_formula: "20 * x"

  # Formula for sizes GREATER than 1
  # Example: 2.22222 * x + 17.77778 → at x=10 health ≈ 40 hearts
  max_formula: "2.22222 * x + 17.77778"

  scale:
    # Whether to enable smooth player size transitions.
    animation_enabled: true

    # Delay between animation steps, in ticks.
    animation_interval: 1

    # Size change applied during each animation step.
    # Smaller values produce smoother, slower transitions.
    # Larger values produce faster, less smooth transitions.
    scale_step: 0.1


