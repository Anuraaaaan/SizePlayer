version: 2

# ==================== НАСТРОЙКИ РАЗМЕРА И ЗДОРОВЬЯ ====================
# Эти параметры определяют, как размер игрока влияет на его здоровье
values:
  # Минимально возможный размер игрока. В ваниле минимальное значение 0.0625
  min_value: 0.4
  # Максимально возможный размер игрока. В ваниле максимальное значение 16
  max_value: 10

  # ==================== ФОРМУЛЫ ЗДОРОВЬЯ ====================
  # Переменная:
  #   x — размер игрока (например: 0.4, 1, 2, 10 и т.д.)
  #
  # Формула должна возвращать число — количество здоровья.
  #
  # Пример: 20 * x
  #   При x = 1 → 20 сердец
  #   При x = 0.5 → 10 сердец
  # ---------------------------------------------------------
  # ПОДДЕРЖИВАЕМЫЕ ОПЕРАЦИИ:
  #   +   сложение
  #   -   вычитание
  #   *   умножение
  #   /   деление
  #   ^   степень
  # ---------------------------------------------------------
  # ПОДДЕРЖИВАЕМЫЕ ФУНКЦИИ (exp4j):
  # Корни:
  #   sqrt(x)   — квадратный корень
  #   cbrt(x)   — кубический корень
  # Тригонометрия:
  #   sin(x)
  #   cos(x)
  #   tan(x)
  #   asin(x)
  #   acos(x)
  #   atan(x)
  # Логарифмы:
  #   log(x)    — натуральный логарифм
  #   log10(x)  — логарифм по основанию 10
  # Округление:
  #   floor(x)  — округление вниз
  #   ceil(x)   — округление вверх
  #   round(x)  — округление до ближайшего
  # Модули и прочее:
  #   abs(x)    — модуль числа
  #   min(a,b)  — минимальное из двух чисел
  #   max(a,b)  — максимальное из двух чисел
  # ---------------------------------------------------------
  # КОНСТАНТЫ:
  #   pi — число Пи (3.1415926...)
  #   e  — число Эйлера (2.71828...)
  # ---------------------------------------------------------
  # ЛОГИКА РАБОТЫ:
  #
  # Диапазон размеров разбит на 2 зоны:
  #
  #   1) x < 1      → используется min_formula
  #   2) x > 1     → используется max_formula
  #
  # Это позволяет отдельно настраивать маленьких и больших игроков.
  # ---------------------------------------------------------

  # Формула для размеров МЕНЬШЕ 1
  # Пример: 20 * x → при x=0.4 здоровье = 8 сердец
  min_formula: "20 * x"

  # Формула для размеров БОЛЬШЕ 1
  # Пример: 2.22222 * x + 17.77778 → при x=10 здоровье ≈ 40 сердец
  max_formula: "2.22222 * x + 17.77778"

# ==================== СООБЩЕНИЯ ====================
# Все сообщения поддерживают цветовые коды в формате &#RRGGBB (например, &#138808 — зелёный)
# Плейсхолдеры применяются только в тех сообщениях, в которых они указаны:
# %min_value%, %max_value%, %player_target%, %player_sender%
messages:
  # ----- Статус плагина -----
  plugin_enable: '&#138808Плагин запущен'
  plugin_disable: '&#ff0033Плагин отключен'
  config_reloaded: '&#138808Конфиг перезагружен'

  # ----- Ошибки прав и аргументов -----
  console_message: '&#ff0033Ты не игрок'
  no_permissions: '&#ff0033У тебя нет разрешения'
  no_arguments: '&#ff0033Вы не ввели аргументы или ввели не все аргументы'
  no_online: '&#ff0033Игрок не в сети'
  no_number: '&#ff0033Вы ввели не число'

  # ----- Ошибки диапазона и формул -----
  invalid_range: '&#ff0033Твой размер не находится в диапазоне %min_value% - %max_value%'
  formula_invalid: '&#ff0033В конфиге неправильно указана формула'

  # ----- Успешное изменение размера -----
  size_set_sender: '&#138808Ты изменил размер %player_target%'
  size_set_target: '&#138808Вам изменил размер %player_sender%'
  size_set_own: '&#138808Вы изменили размер'
