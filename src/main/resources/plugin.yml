name: SizePlayer
version: '2.1'
main: com.anuran.sizeplayer.SizePlayer
api-version: '1.21'
authors: [anuraaaan]
commands:
  sizeplayer:
    description: Plugin command
    aliases:
      - sp
      - sizep
      - splayer
permissions:
  sizeplayer.set:
    description: Change your own size
    default: op
  sizeplayer.set.names:
    description: Change other players' size
    default: op
  sizeplayer.reload:
    description: Reload the plugin
    default: op
