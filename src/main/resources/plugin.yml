name: SizePlayer
version: '2.0'
main: com.anuran.sizeplayer.SizePlayer
api-version: '1.21'
commands:
  sizeplayer:
    description: Команда плагина
permissions:
  sizeplayer.own:
    description: Изменить рост себе
    default: false
  sizeplayer.set:
    description: Изменить рост другим
    default: false
  sizeplayer.reload:
    description: Перезагрузить плагин
    default: false
